<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Bee Global Explore — Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="assets/css/admin.css">

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <h1><i class="ph ph-airplane-tilt"></i> Bee Global Explore</h1>
    <p class="sub">Admin dashboard — authorized access only.</p>

    <div id="loginError" class="error-box hidden"></div>

    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" required autocomplete="current-password">
      </div>
      <button id="loginBtn" type="submit" class="btn">Sign In</button>
    </form>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboardScreen" class="hidden">
  <header class="dash-header">
    <div class="brand"><span class="dot"></span> Bee Global Explore — Admin</div>
    <div style="display:flex; gap:.6rem; align-items:center;">
      <button id="refreshBtn" class="logout-btn"><i class="ph ph-arrow-clockwise"></i> Refresh</button>
      <button id="logoutBtn" class="logout-btn"><i class="ph ph-sign-out"></i> Sign Out</button>
    </div>
  </header>

  <div class="dash-body">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="submissions">Submissions</button>
      <button class="tab-btn" data-tab="packages">Holiday Packages</button>
    </div>

    <div id="submissionsTab" class="tab-panel">
      <div id="statsBar"></div>

      <div class="filters">
        <input id="searchInput" type="text" placeholder="Search name, phone, email, details...">
        <select id="serviceFilter"><option value="">All Services</option></select>
        <select id="statusFilter">
          <option value="">All Statuses</option>
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="closed">Closed</option>
        </select>
      </div>

      <div id="submissionsList"></div>
    </div>

    <div id="packagesTab" class="tab-panel hidden">
      <div class="packages-toolbar">
        <button id="addPackageBtn" class="btn" style="width:auto;"><i class="ph ph-plus"></i> Add New Package</button>
      </div>
      <div id="packagesList"></div>
    </div>
  </div>
</div>

<!-- Package add/edit form -->
<div id="packageModal" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-card-header">
      <h2 id="packageFormTitle">Add Package</h2>
      <button id="packageModalClose" class="icon-btn" aria-label="Close"><i class="ph ph-x"></i></button>
    </div>
    <form id="packageForm">
      <input type="hidden" id="pkgId">
      <div class="field">
        <label for="pkgName">Package Name</label>
        <input id="pkgName" type="text" required placeholder="e.g. Dubai 5-Day Getaway">
      </div>
      <div class="field">
        <label for="pkgPrice">Starting Price (\u20a6)</label>
        <input id="pkgPrice" type="number" min="0" step="1000" required placeholder="850000">
      </div>
      <div class="field">
        <label for="pkgIncludes">Includes (comma-separated)</label>
        <input id="pkgIncludes" type="text" placeholder="Flight, Hotel, Airport Transfer, City Tour">
      </div>
      <div class="field">
        <label for="pkgBlurb">Short Description</label>
        <textarea id="pkgBlurb" rows="2" placeholder="One or two sentences about this package"></textarea>
      </div>
      <div class="field">
        <label for="pkgItinerary">Sample Itinerary (one step per line)</label>
        <textarea id="pkgItinerary" rows="5" placeholder="Arrival & airport transfer&#10;City tour&#10;Free day&#10;Departure transfer"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="pkgSortOrder">Display Order</label>
          <input id="pkgSortOrder" type="number" value="0">
        </div>
        <div class="field field-checkbox">
          <label><input id="pkgActive" type="checkbox" checked> Visible on website</label>
        </div>
      </div>
      <div id="packageFormError" class="error-box hidden"></div>
      <div class="modal-actions">
        <button type="button" id="packageDeleteBtn" class="btn-danger hidden">Delete Package</button>
        <button type="submit" id="packageSaveBtn" class="btn" style="width:auto;">Save Package</button>
      </div>
    </form>
  </div>
</div>

<script src="assets/js/admin.js"></script>
</body>
</html>
