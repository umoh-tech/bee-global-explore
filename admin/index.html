<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Bee Global Explore — Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="assets/css/admin.css">

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <h1><i class="ph ph-airplane-tilt"></i> Bee Global Explore</h1>
    <p class="sub">Admin dashboard — authorized access only.</p>

    <div id="loginError" class="error-box hidden"></div>

    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" required autocomplete="current-password">
      </div>
      <button id="loginBtn" type="submit" class="btn">Sign In</button>
    </form>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboardScreen" class="hidden">
  <header class="dash-header">
    <div class="brand"><span class="dot"></span> Bee Global Explore — Admin</div>
    <div style="display:flex; gap:.6rem; align-items:center;">
      <button id="refreshBtn" class="logout-btn"><i class="ph ph-arrow-clockwise"></i> Refresh</button>
      <button id="logoutBtn" class="logout-btn"><i class="ph ph-sign-out"></i> Sign Out</button>
    </div>
  </header>

  <div class="dash-body">
    <div id="statsBar"></div>

    <div class="filters">
      <input id="searchInput" type="text" placeholder="Search name, phone, email, details...">
      <select id="serviceFilter"><option value="">All Services</option></select>
      <select id="statusFilter">
        <option value="">All Statuses</option>
        <option value="new">New</option>
        <option value="contacted">Contacted</option>
        <option value="closed">Closed</option>
      </select>
    </div>

    <div id="submissionsList"></div>
  </div>
</div>

<script src="assets/js/admin.js"></script>
</body>
</html>
